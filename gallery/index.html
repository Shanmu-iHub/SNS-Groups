<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gallery | SNS Institutions</title>
  <meta name="description"
    content="Explore the vibrant life, state-of-the-art infrastructure, and events at SNS Institutions.">
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.4.0/css/all.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap"
    rel="stylesheet">
  <link
    href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200"
    rel="stylesheet">
  <link rel="icon" type="image/png" href="https://www.snsgroups.com/sns.png">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
          },
          colors: {
            sns: {
              primary: '#1e40af',
              secondary: '#7c3aed',
              accent: '#f59e0b',
              dark: '#0f172a',
              light: '#f8fafc'
            }
          }
        }
      }
    }
  </script>
  <style>
    html {
      scroll-behavior: smooth;
    }

    .scroll-animate {
      opacity: 0;
      transform: translateY(20px);
      transition: all 0.6s ease-out;
    }

    .scroll-animate.visible {
      opacity: 1;
      transform: translateY(0);
    }
    
    .gallery-item {
      overflow: hidden;
      border-radius: 1rem;
      position: relative;
    }
    
    .gallery-item img {
      transition: transform 0.5s ease;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    
    .gallery-item:hover img {
      transform: scale(1.1);
    }
    
    .gallery-overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(to top, rgba(0,0,0,0.8), transparent);
      opacity: 0;
      transition: opacity 0.3s ease;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      padding: 1.5rem;
    }
    
    .gallery-item:hover .gallery-overlay {
      opacity: 1;
    }
  </style>
</head>

<body class="font-sans bg-gray-50 text-gray-800">

  <!-- Header -->
  <div id="global-header"></div>

  <!-- Hero Section -->
  <section class="relative pt-[140px] pb-24 bg-gray-900 overflow-hidden min-h-[40vh] flex flex-col justify-center">
    <div class="absolute inset-0 z-0 opacity-40">
      <img src="Assets/Copy%20of%206g.jpg" alt="Campus Life" class="w-full h-full object-cover">
    </div>
    <div class="absolute inset-0 z-0 bg-gradient-to-t from-gray-900 via-gray-900/80 to-transparent"></div>
    
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 relative z-10 text-center">
      <div class="text-sm font-semibold text-gray-300 uppercase tracking-wider mb-4">
        Home <i class="fas fa-chevron-right text-[10px] mx-2"></i> Gallery
      </div>
      <h1 class="text-4xl md:text-6xl font-extrabold text-white mb-6 tracking-tight">
        Campus Gallery
      </h1>
      <p class="text-xl text-gray-200 max-w-2xl mx-auto font-medium">
        Discover the vibrant life, cutting-edge infrastructure, and memorable events at SNS Institutions.
      </p>
      <div class="w-16 h-1 bg-purple-500 mx-auto mt-8 rounded-full"></div>
    </div>
  </section>

  <!-- Gallery Section -->
  <section class="py-20 bg-white">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
      
      <!-- Filter Tabs -->
      <div class="flex flex-wrap justify-center gap-4 mb-12 scroll-animate" id="gallery-filters">
        <button data-filter="all" class="filter-btn px-6 py-2 rounded-full bg-purple-600 text-white font-semibold shadow-md transition-all hover:bg-purple-700">All</button>
        <button data-filter="campus" class="filter-btn px-6 py-2 rounded-full bg-gray-100 text-gray-600 font-semibold shadow-sm transition-all hover:bg-gray-200">Campus</button>
        <button data-filter="gym" class="filter-btn px-6 py-2 rounded-full bg-gray-100 text-gray-600 font-semibold shadow-sm transition-all hover:bg-gray-200">Gym</button>
        <button data-filter="sports" class="filter-btn px-6 py-2 rounded-full bg-gray-100 text-gray-600 font-semibold shadow-sm transition-all hover:bg-gray-200">Sports</button>
      </div>

      <!-- Photo Grid -->
      <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-6 grid-flow-row-dense scroll-animate delay-100">
        <div class="gallery-item aspect-square shadow-sm" data-category="sports"><img src="Assets/SRI-1%20(1).jpg" alt="Gallery Image"><div class="gallery-overlay"></div></div>
        <div class="gallery-item aspect-square shadow-sm" data-category="campus"><img src="Assets/Copy%20of%20209.jpg" alt="Gallery Image"><div class="gallery-overlay"></div></div>
        <div class="gallery-item aspect-square shadow-sm" data-category="sports"><img src="Assets/Copy%20of%20234.jpg" alt="Gallery Image"><div class="gallery-overlay"></div></div>
        <div class="gallery-item aspect-square shadow-sm" data-category="gym"><img src="Assets/Copy%20of%201g.jpg" alt="Gallery Image"><div class="gallery-overlay"></div></div>
        <div class="gallery-item aspect-square shadow-sm" data-category="sports"><img src="Assets/SCD-2%20(1).jpg" alt="Gallery Image"><div class="gallery-overlay"></div></div>
        <div class="gallery-item aspect-square shadow-sm" data-category="sports"><img src="Assets/SCD%20(1).jpg" alt="Gallery Image"><div class="gallery-overlay"></div></div>
        <div class="gallery-item aspect-square shadow-sm" data-category="gym"><img src="Assets/Copy%20of%20227.jpg" alt="Gallery Image"><div class="gallery-overlay"></div></div>
        <div class="gallery-item aspect-square shadow-sm" data-category="gym"><img src="Assets/Copy%20of%2027%20(1).jpg" alt="Gallery Image"><div class="gallery-overlay"></div></div>
        <div class="gallery-item aspect-square shadow-sm" data-category="campus"><img src="Assets/IIPC%20(1).jpg" alt="Gallery Image"><div class="gallery-overlay"></div></div>
        <div class="gallery-item aspect-square shadow-sm" data-category="campus labs"><img src="Assets/CFC%20soft.jpg" alt="Gallery Image"><div class="gallery-overlay"></div></div>
        <div class="gallery-item aspect-square shadow-sm" data-category="gym"><img src="Assets/Copy%20of%20230.jpg" alt="Gallery Image"><div class="gallery-overlay"></div></div>
        <div class="gallery-item aspect-square shadow-sm" data-category="gym"><img src="Assets/Gym.jpg" alt="Gallery Image"><div class="gallery-overlay"></div></div>
        <div class="gallery-item aspect-square shadow-sm" data-category="campus"><img src="Assets/Copy%20of%202%20(2).jpg" alt="Gallery Image"><div class="gallery-overlay"></div></div>
        <div class="gallery-item aspect-square shadow-sm" data-category="labs"><img src="Assets/SCD-3.jpg" alt="Gallery Image"><div class="gallery-overlay"></div></div>
        <div class="gallery-item aspect-square shadow-sm" data-category="gym"><img src="Assets/Copy%20of%205g.jpg" alt="Gallery Image"><div class="gallery-overlay"></div></div>
        <div class="gallery-item aspect-square shadow-sm" data-category="campus"><img src="Assets/CLT-1%20(1).jpg" alt="Gallery Image"><div class="gallery-overlay"></div></div>
        <div class="gallery-item aspect-square shadow-sm" data-category="campus"><img src="Assets/gallery-clinical-1.jpg" alt="Gallery Image"><div class="gallery-overlay"></div></div>
        <div class="gallery-item aspect-square shadow-sm" data-category="campus"><img src="Assets/CLT-22.jpg" alt="Gallery Image"><div class="gallery-overlay"></div></div>
        <div class="gallery-item aspect-square shadow-sm" data-category="gym"><img src="Assets/Copy%20of%20229.jpg" alt="Gallery Image"><div class="gallery-overlay"></div></div>
        <div class="gallery-item aspect-square shadow-sm" data-category="campus"><img src="Assets/IIPC2.jpg" alt="Gallery Image"><div class="gallery-overlay"></div></div>
        <div class="gallery-item aspect-square shadow-sm" data-category="gym"><img src="Assets/Copy%20of%2026.jpg" alt="Gallery Image"><div class="gallery-overlay"></div></div>
        <div class="gallery-item aspect-square shadow-sm" data-category="gym"><img src="Assets/2.jpg" alt="Gallery Image"><div class="gallery-overlay"></div></div>
        <div class="gallery-item aspect-square shadow-sm" data-category="labs"><img src="Assets/CFC-1.jpg" alt="Gallery Image"><div class="gallery-overlay"></div></div>
        <div class="gallery-item aspect-square shadow-sm" data-category="campus"><img src="Assets/Copy%20of%20210.jpg" alt="Gallery Image"><div class="gallery-overlay"></div></div>
        <div class="gallery-item aspect-square shadow-sm" data-category="gym"><img src="Assets/Copy%20of%202g.jpg" alt="Gallery Image"><div class="gallery-overlay"></div></div>
        <div class="gallery-item aspect-square shadow-sm" data-category="gym"><img src="Assets/Copy%20of%206g.jpg" alt="Gallery Image"><div class="gallery-overlay"></div></div>
      </div>
      
      <!-- Load More -->
      <div class="text-center mt-12 scroll-animate">
        <button class="px-8 py-3 rounded-full border-2 border-purple-600 text-purple-600 font-bold hover:bg-purple-600 hover:text-white transition-all">
          Load More
        </button>
      </div>

    </div>
  </section>

  <!-- Footer -->
  <div id="global-footer"></div>
  <script src="../components/loader.js"></script>

  <script>
    // Scroll Animations
    const observer = new IntersectionObserver(entries => {
      entries.forEach(entry => {
        if (entry.isIntersecting) {
          entry.target.classList.add('visible');
        }
      });
    }, { threshold: 0.1, rootMargin: "0px 0px -50px 0px" });

    document.querySelectorAll('.scroll-animate').forEach(el => observer.observe(el));

    // Gallery Filtering
    const filterBtns = document.querySelectorAll('.filter-btn');
    const galleryItems = document.querySelectorAll('.gallery-item');

    filterBtns.forEach(btn => {
      btn.addEventListener('click', () => {
        // Reset all buttons
        filterBtns.forEach(b => {
          b.classList.remove('bg-purple-600', 'text-white', 'hover:bg-purple-700');
          b.classList.add('bg-gray-100', 'text-gray-600', 'hover:bg-gray-200');
        });
        
        // Set active button
        btn.classList.remove('bg-gray-100', 'text-gray-600', 'hover:bg-gray-200');
        btn.classList.add('bg-purple-600', 'text-white', 'hover:bg-purple-700');

        const filterValue = btn.getAttribute('data-filter');

        galleryItems.forEach(item => {
          const categories = item.getAttribute('data-category').split(' ');
          if (filterValue === 'all' || categories.includes(filterValue)) {
            item.style.display = 'block';
          } else {
            item.style.display = 'none';
          }
        });
      });
    });
  </script>
</body>
</html>
